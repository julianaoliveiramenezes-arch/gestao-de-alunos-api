name: Pipeline de Testes Automatizados da API

on:
  # Dispara a cada push
  push:
    branches: [ main,BranchJuMenezes ]

  # Dispara automaticamente uma vez por dia (às 00:00 UTC / 21:00 BRT)
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js (versão 18)
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Instalar dependências do projeto
        run: npm install

      - name: Iniciar servidor da API em background
        env:
          PORT: 3000
        run: |
          nohup npm start > api.log 2>&1 &
          sleep 8

      - name: Executar suíte de testes
        env:
          BASE_URL: http://localhost:3000
          ADMIN_EMAIL: admin@escola.com
          ADMIN_SENHA: admin123
        run: npm test